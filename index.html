<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17664f"><title>码序 · 批量扫码记录</title><link rel="stylesheet" href="style.css"><body><header><a class="brand" href="#">▦ <b>码序</b><span>QR LEDGER</span></a><span class="local">● 仅保存在本机</span></header><main><div class="intro"><div class="eyebrow">让每一次扫描，都有迹可循</div><h1>连续扫描，自动成册。</h1><p>对准二维码即可记录。编号、去重、保存，交给码序。</p></div><div class="layout"><section class="scanner"><div class="sectionhead"><b>扫描工作台</b><span id="status">待开始</span></div><div class="viewport" id="viewport"><video id="video" playsinline muted></video><div class="reticle"></div><div class="placeholder" id="placeholder"><div class="qr">▦</div><b>将二维码放入取景框</b><p>支持实物与纸质二维码</p></div><div class="camera-tag">后置摄像头 · 自动识别</div></div><div id="feedback" role="status" aria-live="polite">准备就绪，点击下方开始扫描</div><button id="start" class="primary">⌁ 开始扫描</button><div class="tips"><span>01 对准二维码</span><span>02 自动保存</span><span>03 继续扫描</span></div><p class="small">摄像头画面与扫码内容不会上传。震动反馈取决于设备支持。</p></section><section class="records"><div class="sectionhead"><div><b>扫描记录</b><span class="count" id="count">0</span></div><button id="export">↓ 导出 CSV</button></div><div class="summary"><div><small>已记录</small><strong id="total">0</strong></div><div><small>下一个编号</small><strong id="next">001</strong></div><span id="saved">自动保存已开启</span></div><label class="search">⌕ <input id="search" placeholder="搜索二维码内容或编号" type="search"></label><div class="listhead"><span>编号 / 二维码内容</span><span>扫描时间</span></div><div id="list"></div><div class="footnote">删除不重排编号 · 导出包含全部记录</div></section></div><footer><b>每一码，都井然有序。</b><span>数据保存在当前浏览器；清除浏览器数据会删除记录，请及时导出备份。</span></footer></main><canvas id="canvas" hidden></canvas><dialog id="editor"><form method="dialog"><h2 id="editTitle">编辑备注</h2><textarea id="note" maxlength="10000" placeholder="填写备注（可选）"></textarea><div class="dialog-actions"><button value="cancel">取消</button><button id="saveNote" class="primary" value="save">保存备注</button></div></form></dialog><script src="vendor/jsQR.js"></script><script src="app.js"></script></body></html>
